<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErrandPlanner MVP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ ErrandPlanner</h1>
            <p>Plan your errands efficiently</p>
        </header>
        
        <main>
            <form id="errandForm">
                <div class="input-group">
                    <input type="text" 
                           placeholder="Enter errand location (e.g., Target, 123 Main St)" 
                           id="errandInput"
                           autocomplete="off">
                    <button type="button" onclick="addErrand()" class="add-btn">+ Add</button>
                </div>
                
                <ul id="errandList" class="errand-list"></ul>
                
                <button type="button" 
                        id="optimizeBtn" 
                        onclick="optimizeRoute()" 
                        class="optimize-btn"
                        disabled>
                    🚗 OPTIMIZE ROUTE
                </button>
            </form>
            
            <div id="results" class="results-container" style="display: none;"></div>
        </main>
    </div>
    <script src="app.js"></script>
    <script async defer 
            src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=geometry">
    </script>
</body>
</html>
