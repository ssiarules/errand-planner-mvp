<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErrandPlanner MVP - Optimize Your Routes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ ErrandPlanner</h1>
            <p>Plan your errands efficiently and save time!</p>
        </header>

        <main>
            <section class="input-section">
                <div class="input-group">
                    <input type="text" id="errandInput" placeholder="Enter an errand location (e.g., grocery store, bank)" autocomplete="off">
                    <button class="add-btn" onclick="addErrand()">Add Errand</button>
                </div>
            </section>

            <section class="errands-list">
                <h3>Your Errands:</h3>
                <ul id="errandsList" class="errands-container">
                    <li class="placeholder">Add your first errand above!</li>
                </ul>
            </section>

            <section class="optimization">
                <button class="optimize-btn" id="optimizeBtn" onclick="optimizeRoute()" disabled>
                    🚀 Optimize My Route
                </button>
            </section>

            <section class="results" id="resultsSection" style="display: none;">
                <h3>Optimized Route:</h3>
                <div id="routeResults"></div>
                <div id="map" class="map-container"></div>
            </section>
        </main>

        <footer>
            <p>Built with ❤️ for efficient errand running</p>
        </footer>
    </div>

    <script src="app.js"></script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=geometry&callback=initMap">
    </script>
</body>
</html>
