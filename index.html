<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErrandPlanner MVP - Optimize Your Routes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ ErrandPlanner</h1>
            <p>Transform chaotic errands into efficient routes</p>
        </header>
        
        <main>
            <section class="input-section">
                <h2>Add Your Errands</h2>
                <div class="input-group">
                    <input type="text" id="errandInput" placeholder="Enter location (e.g., Grocery Store, 123 Main St)" />
                    <button class="add-btn" onclick="addErrand()">Add</button>
                </div>
            </section>

            <section class="errand-list-section">
                <h3>Your Errands</h3>
                <ul id="errandList" class="errand-list"></ul>
            </section>

            <button id="optimizeBtn" class="optimize-btn" onclick="optimizeRoute()" disabled>
                🚀 Optimize My Route
            </button>

            <section id="results" class="results-section" style="display: none;">
                <h3>Optimized Route</h3>
                <div id="routeResults"></div>
            </section>
        </main>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=geometry"></script>
    <script src="app.js"></script>
</body>
</html>
